name: Lite source checks
on:
  push:
    paths: ['lite/**', 'build-lite.ps1', '.github/workflows/lite-checks.yml']
  pull_request:
    paths: ['lite/**', 'build-lite.ps1', '.github/workflows/lite-checks.yml']
permissions:
  contents: read
jobs:
  playback-and-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test lite/app/src/test/playback.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile navigation policy
        run: javac -d /tmp/lite-policy lite/app/src/main/java/app/anibrowser/lite/SitePolicy.java
