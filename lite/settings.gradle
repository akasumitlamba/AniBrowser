pluginManagement {
    repositories { google(); maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }; gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
        maven { url 'https://maven.mozilla.org/maven2'; content { includeGroup 'org.mozilla.geckoview' } }
    }
}
rootProject.name = 'AniBrowserLite'
include ':app'
